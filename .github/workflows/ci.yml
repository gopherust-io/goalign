name: GoAlign CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.21'
    
    - name: Build
      run: go build -v ./...
    
    - name: Test
      run: go test -v ./...
    
    - name: Install GoAlign
      run: go install github.com/nekruzjm/goalign@latest
    
    - name: Run GoAlign on examples
      run: goalign analyze -r examples/
    
    - name: Run GoAlign on source code
      run: goalign analyze -r . -e examples/
