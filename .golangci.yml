version: "2"

run:
  modules-download-mode: readonly
  tests: true
  timeout: 3m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    govet:
      enable-all: true
      disable:
        - shadow
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          arguments:
            - disableStutteringCheck
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - revive
          - govet
      - path: examples/
        linters:
          - errcheck
          - govet
          - revive
          - staticcheck
          - unused
      - path: cmd/grpcdecode\.go
        linters:
          - staticcheck
          - govet

formatters:
  enable:
    - gofmt
    - goimports
